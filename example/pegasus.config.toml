# Cluster metadata checked with sinfo/scontrol on 2026-09-22.
# Recheck live Slurm metadata before choosing hardware or submitting jobs.
version = 1

[defaults]
pty = true
login_shell = true
max_concurrent_execs = 4
warn_on_login_compute = true
exec_timeout_s = 120
max_output_bytes = 32768
default_cluster = "pegasus"
# Set default_cwd to your actual /scratch/<group>/<user> directory.

[heuristics]
denylist = ["rm -rf /", "mkfs", "shutdown", "reboot"]
compute_markers = ['CUDA_VISIBLE_DEVICES', '(?i)python.(torch|tensorflow|jax)', '\bmpirun\b', '\bsrun\b']

[[clusters]]
id = "pegasus"
display_name = "GWU Pegasus"
host = "pegasus.arc.gwu.edu"
port = 22

[clusters.ssh]
control_path = "~/.gwu-hpc-mcp/cm-%r@%h_%p"
server_alive_interval = 60
server_alive_count_max = 3
ssh_binary = "ssh"
tmux_binary = "tmux"

[clusters.access]
require_vpn = true
prohibit_login_compute = true

[clusters.filesystems]
# lustre_root is a legacy field name; Pegasus /scratch currently resolves to GPFS.
lustre_root = "/scratch"
groups_root = "/scratch"
scratch_recommended = true

[clusters.slurm]
require_partition = true
require_time_limit = true
default_partition = "cpu"
default_time_limit = "01:00:00"

[[clusters.slurm.partitions]]
name = "cpu"
kind = "cpu"
notes = "Default CPU partition; heterogeneous nodes; maximum 14 days."

[[clusters.slurm.partitions]]
name = "gpu"
kind = "gpu"
gpus = ["V100", "A100"]
notes = "Heterogeneous GPU nodes; maximum 7 days. Inspect sinfo GRES and request the needed GPU type/count."

[[clusters.slurm.partitions]]
name = "nano"
kind = "cpu"
notes = "Short CPU jobs; maximum 30 minutes."

[[clusters.slurm.partitions]]
name = "superChip"
kind = "gpu"
gpus = ["GH200"]
notes = "Grace Hopper nodes; maximum 7 days. Check software architecture compatibility."

[[clusters.slurm.partitions]]
name = "viz"
kind = "gpu"
gpus = ["L40S"]
notes = "Visualization nodes; maximum 7 days."

[[clusters.slurm.partitions]]
name = "deus"
notes = "Site-specific partition; Slurm currently advertises unlimited wall time. Confirm intended use and account eligibility with HPC staff."

[clusters.prompts]
slurm_safety_template = """
Run compute through Slurm with explicit -p <partition> and -t <time>. Use your verified scratch working directory under {{groups_root}}. Do not run compute on login nodes.
Check current partitions with sinfo and limits with scontrol show partition. Metadata in this file is a snapshot, not a live inventory.
Keep login_shell enabled for environment modules. Discover software with module spider <name>, module keyword <term>, or module avail 2>&1 | grep <name>.
"""

[clusters.policy]
template = """
{{display_name}} ({{host}}): login nodes are for job submission, data movement, and lightweight preparation. Submit compute through Slurm with explicit partition and wall time.
Use your verified scratch directory under {{groups_root}} for active workloads. Scratch is temporary storage; follow current site retention guidance and store long-term data elsewhere. Do not assume group names match directory names; inspect the actual directory and set default_cwd accordingly.
Off campus, connect to GW VPN and keep it connected. Losing VPN interrupts cluster access and may terminate the SSH connection. If the connection drops, tell the user and ask them to restore VPN and run ghm up with their NetID in their own terminal. The user must complete 2FA themselves. Agents must never guess, generate, reuse, or submit verification codes or ask for them in chat. Do not reset shared SSH connections or retry uncertain job submissions automatically.

Partition snapshot checked 2026-09-22: cpu (14 days), gpu/superChip/viz (7 days), nano (30 minutes), and deus (site-specific). Verify with sinfo and scontrol show partition before submitting. Legacy defq/debug/debug-gpu queues are absent from this snapshot.
GPU resources are advertised through Slurm GRES. Inspect sinfo -o '%P %G' and request the appropriate resources, such as --gres=gpu:v100:1 on gpu (the GPU type is required). Do not blindly remove GPU requests or request an exclusive full node to work around errors; inspect the error and current site configuration.

Example lightweight CPU job: sbatch -p nano -t 00:01:00 -n 1 --mem=128M --wrap 'hostname'
For GPU validation without allocating a job, use sbatch --test-only -p gpu -t 00:01:00 -n 1 --mem=1G --gres=gpu:v100:1 --wrap 'nvidia-smi'.
Monitor jobs with squeue and inspect failures with scontrol show job or sacct. A newly submitted job may take a moment to appear in queries.

Keep login_shell=true for environment modules. Use module spider, module keyword, and filtered module avail listings. For Apptainer, inspect available modules, put APPTAINER_CACHEDIR on scratch, and bind scratch explicitly when needed. Discover required helper tools instead of assuming a particular module version.
Wide terminal output may wrap; shell_exec with pty=false preserves separate stdout and stderr. For tmux/SSH problems, check ghm status before reconnecting.
"""
