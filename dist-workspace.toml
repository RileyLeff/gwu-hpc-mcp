[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
#
# Linux ships musl builds only: Rust's musl targets link statically, so one
# binary runs on any distro and inside WSL without glibc version issues.
#
# x86_64-pc-windows-msvc is EXPERIMENTAL. It builds, but native Windows
# needs a non-ControlMaster SSH backend before `ghm up` works there. Windows
# users should install the Linux build inside WSL instead.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in. CARGO_HOME (~/.cargo/bin)
# matches where `cargo install --path .` put earlier builds, so an installer
# run replaces a source build instead of shadowing it on PATH.
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Homebrew tap (disabled until a tap repo is chosen). To enable:
#   1. Create a public repo such as RileyLeff/homebrew-tap.
#   2. Add a HOMEBREW_TAP_TOKEN secret with write access to it.
#   3. Add "homebrew" to `installers` above, uncomment below, run `dist init`.
# The formula downloads release assets anonymously, so it only works once the
# release assets are public (see docs/install-binaries.md).
# tap = "RileyLeff/homebrew-tap"
# publish-jobs = ["homebrew"]
# formula = "gwu-hpc-mcp"
