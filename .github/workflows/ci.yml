name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest exercises the built-in SSH client end to end: named
        # pipe IPC, the broker, the test SSH server (via Git Bash), and
        # tests/background_up.rs, which runs the real `ghm up` and checks the
        # detached background connection outlives it.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
