[package]
name = "gwu-hpc-mcp"
version = "0.1.2"
edition = "2024"

[dependencies]
rmcp = { version = "3.5", features = ["server", "transport-io"] }
tokio = { version = "1.39", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
regex = "1.10"
notify = "8.2"
which = "8.0"
shell-escape = "0.1"
humantime = "2.1"
parking_lot = "0.12"
futures = "0.3"
once_cell = "1.19"
uuid = { version = "1.8", features = ["v4"] }
schemars = "1.0"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
rpassword = "7.5.4"
bytes = "1.12.1"
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_Console"] }
