[package]
name = "gwu-hpc-mcp"
version = "0.1.2"
edition = "2024"

[dependencies]
rmcp = { version = "0.9", features = ["server", "transport-io"] }
tokio = { version = "1.39", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
regex = "1.10"
notify = "8.2"
which = "8.0"
shell-escape = "0.1"
humantime = "2.1"
parking_lot = "0.12"
futures = "0.3"
once_cell = "1.19"
uuid = { version = "1.8", features = ["v4"] }
schemars = "1.0"
